<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/styles.css" />
	<script defer src="./main.js"></script>
	<title>Frontend Mentor | Tip calculator app</title>
</head>

<body>
	<header>
		<img src="./images/logo.svg" alt="Splitter" />
	</header>
	<main>
		<form>
			<div class="form-section">
				<label for="bill-amount" class="input-label">Bill</label>
				<div class="input-wrapper">
					<span class="error-message" aria-live="polite" aria-describedby="number-error">Can't be zero</span>
					<img src="./images/icon-dollar.svg" alt="" />
					<input type="number" id="bill-amount" name="bill_amount" class="bill-amount default" placeholder="0" min="0"
						required>
				</div>
			</div>
			<div class="form-section">
				<div class="tip-percentage-options">
					<label for="custom-tip" class="input-label">Select Tip %</label>
					<div class="radio-array">
						<input type="radio" id="tip-percentage-5" name="tip_percentage" class="tip-percentage preset-tip-percentage"
							value="5">
						<input type="radio" id="tip-percentage-10" name="tip_percentage"
							class="tip-percentage preset-tip-percentage" value="10">
						<input type="radio" id="tip-percentage-15" name="tip_percentage"
							class="tip-percentage preset-tip-percentage" value="15">
						<input type="radio" id="tip-percentage-25" name="tip_percentage"
							class="tip-percentage preset-tip-percentage" value="25">
						<input type="radio" id="tip-percentage-50" name="tip_percentage"
							class="tip-percentage preset-tip-percentage" value="50">
						<div class="custom-tip-radio" data-display="Custom">
							<input type="radio" id="tip-percentage-custom" name="tip_percentage" class="tip-percentage"
								value="Custom">
							<input type="number" id="custom-tip" name="custom_tip" aria-label="Custom tip percentage" min="0">
						</div>
					</div>
				</div>
			</div>
			<div class="form-section">
				<label for="number-of-people" class="input-label">Number of People</label>
				<div class="input-wrapper">
					<span class="error-message" aria-live="polite" aria-describedby="number-error">Can't be zero</span>
					<img src="./images/icon-person.svg" alt="">
					<input type="number" id="number-of-people" name="number_of_people" class="number-of-people default"
						placeholder="0" min="0" required>
				</div>
			</div>
		</form>
		<section class="results">
			<div class="calculated-results">
				<div class="tip-amount result">
					<div class="results-label">
						<p>Tip Amount</p>
						<p class="results-person">/ person</p>
					</div>
					<div class="amount-display tip-per-person">$4.27</div>
				</div>
				<div class="total-amount result">
					<div class="results-label">
						<p>Tip Amount</p>
						<p class="results-person">/ person</p>
					</div>
					<div class="amount-display total-per-person">$32.79</div>
				</div>
			</div>
			<button class="reset-button">Reset</button>
		</section>
	</main>
	<footer class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
		Coded by <a href="#">Your Name Here</a>.
	</footer>
</body>

</html>

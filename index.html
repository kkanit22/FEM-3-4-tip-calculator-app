<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/styles.css" />
	<script defer src="./main.js"></script>
	<title>Frontend Mentor | Tip calculator app</title>
</head>

<body>
	<header>
		<img src="./images/logo.svg" alt="Splitter" />
	</header>
	<main>
		<form>
			<label for="bill-amount" class="bill-amount-label">Bill</label>
			<input type="number" id="bill-amount" name="bill_amount" class="bill-amount"  placeholder="0" required>

			<div class="tip-percentage-options">
				<label for="tip-percentage" class="tip-percentage-label">Select Tip %</label>
				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="5%" checked>

				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="10%">

				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="15%">

				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="25%">

				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="50%">

				<input type="radio" id="tip-percentage" name="tip_percentage" class="tip-percentage" value="Custom">
			</div>

			<label for="number-of-people" class="number-of-people-label">Number of People</label>
			<input type="number" id="number-of-people" name="number_of_people" class="number-of-people" placeholder="0" required>
		</form>
		<section class="results">
			<div class="calculated-results">
				<div class="tip-amount">
					<div class="results-label">
						<p>Tip Amount</p>
						<p>/ person</p>
					</div>
					<div class="amount-diplay tip-per-person">$4.27</div>
				</div>
				<div class="total-amount">
					<div class="results-label">
						<p>Tip Amount</p>
						<p>/ person</p>
					</div>
					<div class="amount-diplay total-per-person">$32.79</div>
				</div>
			</div>
			<button class="reset-button">Reset</button>
		</section>
	</main>
	<footer class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
		Coded by <a href="#">Your Name Here</a>.
	</footer>
</body>

</html>
